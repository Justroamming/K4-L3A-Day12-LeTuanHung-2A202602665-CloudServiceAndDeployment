# CI/CD Pipeline for Day 12 Cloud Service
# Triggered on push/PR to main. Runs tests, builds Docker image, deploys to Render.

name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  AGENT_API_KEY: ci-dummy
  REDIS_URL: "fake://"

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests (excluding deployment tests)
        run: |
          pytest tests/ -v --ignore=tests/test_cp5.py --ignore=tests/test_bonus_cicd.py

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t day12-agent:ci .

  deploy:
    name: Deploy to Render
    needs: [test, build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via Render Deploy Hook
        run: |
          curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"

      - name: Smoke test
        run: |
          sleep 45
          curl -fsS "${{ vars.PUBLIC_URL }}/health"